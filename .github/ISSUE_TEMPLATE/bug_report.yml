name: 버그 보고
description: 재현 가능한 문제와 기대 동작을 기록합니다.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: "비밀번호·API 키·토큰·개인 지원 서류는 첨부하지 마세요. 이슈 생성은 실제 지원·삭제·예약 가동 승인이 아닙니다."
  - type: textarea
    id: problem
    attributes:
      label: 문제와 기대 동작
      description: 실제 동작과 기대 동작을 구분해주세요.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 재현 방법과 근거
      description: 입력·명령·오류를 비밀 없이 작성하고 로컬/원격을 구분해주세요.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 완료 기준과 검증 방법
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: 환경·영향·복구
      description: OS/Python/backend, 영향 범위와 원본 보존 방법. 모르면 미확인으로 표시.
    validations:
      required: true
