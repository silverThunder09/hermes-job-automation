name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, Python 3.11)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONUTF8: '1'
      AUTO_SUBMIT: 'false'
      FORM_AUTOFILL_ENABLED: 'false'
      SARAMIN_API_APPROVED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install Korean font (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fonts-nanum
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Install browser
        run: python -m playwright install --with-deps chromium
      - name: Compile source
        run: python -m compileall -q src
      - name: Test local fixtures only
        run: python -m pytest -o addopts='' -q
