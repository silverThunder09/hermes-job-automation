name: cloud-mcp-readonly-probe

on:
  push:
    branches: ['test/26-cloud-mcp-probe']
    paths:
      - '.github/workflows/cloud-mcp-probe.yml'
      - 'spikes/001-cloud-mcp-probe/**'

permissions:
  contents: read

concurrency:
  group: cloud-mcp-probe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cloud-proof:
    if: contains(github.event.head_commit.message, '[run-cloud-mcp-probe]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: spikes/001-cloud-mcp-probe
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Install locked probe dependencies (no lifecycle scripts)
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Synthetic safety tests
        run: npm test
      - name: Install headless Chromium on this GitHub-hosted runner
        run: node node_modules/playwright/cli.js install --with-deps chromium
      - name: One public navigation through actual Playwright MCP
        run: npm run probe
      - name: Save minimal public diagnostic (no page body or credentials)
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: cloud-mcp-proof-${{ github.run_id }}
          path: spikes/001-cloud-mcp-probe/cloud-probe-result.json
          if-no-files-found: warn
          retention-days: 1
