[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-job-automation"
version = "0.1.0"
description = "Policy-aware job discovery and application preparation orchestrated by Hermes Agent"
requires-python = ">=3.9"
dependencies = [
  "google-api-python-client>=2.140,<3",
  "google-auth>=2.35,<3",
  "google-auth-httplib2>=0.2,<1",
  "google-auth-oauthlib>=1.2,<2",
  "openai>=1.50,<3",
  "playwright>=1.47,<2",
  "greenlet>=3.1.1,<3.2",
  "python-docx>=1.1,<2",
  "reportlab>=4.2,<5",
  "python-dotenv>=1.0,<2",
  "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
job-assist = "hermes_job_automation.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
